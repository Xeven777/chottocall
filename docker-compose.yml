services:
  embeddings:
    image: ghcr.io/ggml-org/llama.cpp:server
    network_mode: host
    volumes:
      - ${EMBEDDING_MODEL_PATH:-/home/anish/apps/models/embeddinggemma-2-Q8_0.gguf}:/models/embedding.gguf:ro
    command: >
      --model /models/embedding.gguf --embedding --host 0.0.0.0 --port 8081 --ctx-size 2048
    restart: unless-stopped

  backend:
    build: ./backend
    image: chottocall-backend
    # Host networking keeps WebRTC host candidates reachable from the browser
    # and lets the configured localhost LLM URLs work unchanged (Linux only).
    network_mode: host
    env_file: .env
    volumes:
      - ./backend/models:/app/models
    depends_on:
      - embeddings
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: chottocall-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
