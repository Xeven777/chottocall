[project]
name = "chottocall-backend"
version = "0.1.0"
description = "FastAPI backend for ChottoCall"
requires-python = ">=3.11"
dependencies = [
    "cactus-compute>=4.1.0",
    "fastapi>=0.115,<1.0",
    "pipecat-ai[groq,local,silero,webrtc]>=1.15.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.30,<1.0",
    # Mithi TTS (local). Kept in the base set so a plain `uv run` never silently
    # strips it and drops the voice pipeline back to Speechify.
    "torch>=2.15",
    "transformers>=5.0",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "numpy>=1.26",
    "soundfile>=0.12",
    "misaki[en]>=0.9.4",
    "espeakng-loader>=0.2.4",
    "phonemizer-fork>=3.3.2",
    "spacy>=3.8",
    # misaki's English G2P loads this at synthesis time; pin it so no call
    # depends on a runtime spacy.cli.download (needed even for Latin words in Bengali).
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "num2words>=0.5",
    "huggingface_hub>=0.26",
    "pgvector>=0.5.1",
    "sqlalchemy[asyncio]>=2.1.9",
    "asyncpg>=0.32.0",
    "python-multipart>=0.0.34",
    "pypdfium2>=5.15.2",
]

[tool.uv]
package = false

# CPU-only torch: the XPU build was never used (no Level Zero runtime), and
# triton-xpu alone added ~1.7 GB to the image.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
